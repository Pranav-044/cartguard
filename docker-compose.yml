version: "3.9"

services:
  cartguard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/cartguard.db
      - NODE_ENV=production
      # ── Required: copy from .env.local ──────────────────────────────
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # ── Demo mode: enables /api/test-payment for buyer agent ─────────
      - ENABLE_TEST_PAYMENT=${ENABLE_TEST_PAYMENT:-true}
    volumes:
      - cartguard_data:/app/data
    # Entrypoint: migrate schema, then start server
    # NOTE: seed is NOT run here — run once manually with:
    #   docker compose exec cartguard sh -c "DATABASE_URL=file:/app/data/cartguard.db npx prisma db seed"
    command: >
      sh -c "
        DATABASE_URL=file:/app/data/cartguard.db npx prisma migrate deploy &&
        node server.js
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/catalog.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cartguard_data:
    driver: local
